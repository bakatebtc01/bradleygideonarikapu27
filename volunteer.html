<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Portal | Arikapu 2027</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header compact"><a href="index.html" class="brand-link">← Home</a><h1>Volunteer Portal</h1></header>
  <main>
    <section>
      <form id="volunteerForm" class="card-form">
        <label>Name<input name="name" required type="text"></label>
        <label>Ward<input name="ward" required type="text"></label>
        <label>LLG<input name="llg" required type="text"></label>
        <label>District<input name="district" required type="text"></label>
        <label>Phone<input name="phone" required type="tel"></label>
        <label>Skills<textarea name="skills" rows="3"></textarea></label>
        <fieldset>
          <legend>Role</legend>
          <label><input type="radio" name="role" value="Village Coordinator" required> Village Coordinator</label>
          <label><input type="radio" name="role" value="Youth Leader"> Youth Leader</label>
          <label><input type="radio" name="role" value="Women’s Mobilizer"> Women’s Mobilizer</label>
        </fieldset>
        <div class="cta-row">
          <button class="button" type="submit">Sign Up</button>
          <button class="button secondary" id="downloadCsv" type="button">Export to CSV</button>
        </div>
      </form>
      <p id="volunteerStatus"></p>
    </section>

    <section>
      <h2>Volunteer Tracks</h2>
      <ul>
        <li><a href="village-coordinator-signup.html">Village Coordinator Signup</a></li>
        <li><a href="youth-team.html">Youth Team</a></li>
      </ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
