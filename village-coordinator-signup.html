<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Village Coordinator Signup</title><link rel="stylesheet" href="styles.css"/></head><body><header class="site-header compact"><a href="volunteer.html" class="brand-link">← Volunteer Portal</a><h1>Village Coordinator Signup</h1></header><main><section><p>Village coordinators support ward-level mobilization and voter education.</p><form id="volunteerForm" class="card-form"><label>Name<input name="name" required type="text"></label><label>Ward<input name="ward" required type="text"></label><label>LLG<input name="llg" required type="text"></label><label>District<input name="district" required type="text"></label><label>Phone<input name="phone" required type="tel"></label><label>Skills<textarea name="skills" rows="3"></textarea></label><fieldset><legend>Role</legend><label><input type="radio" name="role" value="Village Coordinator" required> Village Coordinator</label></fieldset><div class="cta-row"><button class="button" type="submit">Sign Up</button><button class="button secondary" id="downloadCsv" type="button">Export to CSV</button></div></form><p id="volunteerStatus"></p></section></main><script src="script.js"></script></body></html>
